<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#023C91">
<title>{{NAME}} | {{COMPANY}}</title>
<meta name="description" content="{{NAME}}, {{TITLE}}, {{COMPANY}}">
<link rel="icon" href="../../assets/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../assets/logo-256.png">
<link rel="stylesheet" href="../../assets/card.css">
</head>
<body>
<main class="card">
  <div class="band"></div>
  <img class="logo" src="../../assets/logo.svg" alt="Cobalt Origin logo" width="112" height="112">
  <h1>{{NAME}}</h1>
  <p class="role">{{TITLE}}</p>
  <p class="company">{{COMPANY}}</p>

  <a class="save" href="{{VCF}}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-3.9 3.1-7 7-7s7 3.1 7 7"/><path d="M19 8v6M16 11h6"/></svg>
    Save Contact
  </a>

  <nav class="actions">
{{ACTIONS}}
  </nav>

  <ul class="details">
{{DETAILS}}
  </ul>
</main>
<footer>&copy; {{COMPANY}}</footer>
</body>
</html>
